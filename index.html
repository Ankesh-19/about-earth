<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Jumping</title>
    <meta name="description" content="An immersive space portal experience with canvas 3D perspective and interplanetary travel." />
    <meta property="og:title" content="Planet Jumping" />
    <meta property="og:description" content="An immersive space portal experience with canvas 3D perspective and interplanetary travel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @font-face {
        font-family: 'SF Pro';
        font-weight: 400;
        src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('Helvetica Neue'), local('Arial');
      }
      @font-face {
        font-family: 'SF Pro';
        font-weight: 700;
        src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
      }
      @font-face {
        font-family: 'SF Pro Thin';
        font-weight: 100;
        src: local('SF Pro Thin'), local('SFProText-Thin'), local('SF Pro Light'), local('Arial');
      }
      @font-face {
        font-family: 'Aalto';
        font-weight: 400;
        src: local('Aalto'), local('Arial Narrow'), local('Impact');
      }

      :root {
        font-family: 'SF Pro', Arial, sans-serif;
        color: #fff;
        background: #090807;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0908;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }

      .backgrounds,
      .background,
      .shade,
      .transition-layer,
      .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity .8s ease;
      }
      .background.is-visible {
        opacity: 1;
      }

      .shade {
        z-index: 1;
        background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
        pointer-events: none;
      }

      .chrome {
        position: absolute;
        z-index: 4;
        transition: opacity .45s ease, filter .45s ease;
      }
      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }

      /* HEADER */
      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid rgba(255, 255, 255, .45);
        background: rgba(255, 255, 255, .1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
      }
      .nav a {
        color: #fff;
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
      }
      .nav a.active {
        background: #fff;
        color: #000;
      }
      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        cursor: pointer;
      }

      /* SIDEBAR */
      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 50%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .planet-item {
        display: flex;
        align-items: center;
        min-height: 20px;
        opacity: 0.65;
        transition: opacity .3s ease;
      }
      .planet-item.active {
        font-size: 18px;
        font-weight: 700;
        gap: 8px;
        opacity: 1;
      }
      .planet-item.active:before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        flex-shrink: 0;
      }

      /* PORTAL */
      .portal-wrap {
        left: 50%;
        top: 50%;
        width: min(320px, 31vw);
        transform: translate(-50%, -54%);
        perspective: none;
      }
      .portal-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }
      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }
      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320/350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 90px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
      }
      .portal video,
      .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* CONTENT */
      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(24px, 3vh, 30px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
        pointer-events: none;
      }
      .planet-content h1 {
        font-family: 'Aalto', 'Arial Narrow', sans-serif;
        font-size: clamp(128px, 21.8vw, 314px);
        font-weight: 400;
        line-height: .72;
        margin: 0 0 -.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
        user-select: none;
      }
      .planet-content dl {
        width: min(447px, 34vw);
        margin: 0;
        font-size: 16px;
        pointer-events: auto;
      }
      .fact {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, .48);
        opacity: 0;
      }
      .fact:last-child {
        border-bottom: 0;
      }
      .fact dt {
        font-weight: 700;
      }
      .fact dd {
        margin: 0;
      }

      /* MISC */
      .transition-layer {
        display: none;
      }
      .scene-canvas {
        display: none;
      }
      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: .14em;
        text-transform: uppercase;
        transition: opacity .2s;
        pointer-events: none;
      }
      .experience.is-loading .loading {
        opacity: .8;
      }
      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }
      .experience.is-transitioning .shade {
        opacity: 1;
      }
      .experience.is-committing .background {
        transition: none !important;
      }

      /* PRELOADER */
      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
      }
      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }
      .preloader.is-background {
        z-index: 0;
      }
      .preloader.is-background .preloader-shade {
        opacity: 0;
      }
      .floating-logo {
        position: fixed;
        z-index: 22;
        left: 50%;
        top: 50%;
        width: 59px;
        height: 58px;
        transform: translate(-50%, -50%);
        will-change: left, top, width, height, transform;
        transition:
          left 2s cubic-bezier(.16, 1, .3, 1),
          top 2s cubic-bezier(.16, 1, .3, 1),
          width 2s cubic-bezier(.16, 1, .3, 1),
          height 2s cubic-bezier(.16, 1, .3, 1),
          transform 2s cubic-bezier(.16, 1, .3, 1);
        pointer-events: none;
      }
      .floating-logo.is-docked {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: 37px;
        height: 36px;
        transform: none;
      }
      .floating-logo.is-settled {
        z-index: 5;
      }
      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: 'SF Pro', Arial, sans-serif;
        line-height: 1;
        pointer-events: none;
      }
      .preloader-count > span:first-child {
        font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }
      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }
      .preloader-count.is-leaving {
        animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
      }
      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }
      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }

      /* CUSTOM CURSOR */
      html, body, button, a, .portal {
        cursor: none !important;
      }
      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s ease;
      }
      .custom-cursor.is-visible {
        opacity: 1;
      }
      .cursor-dot,
      .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
      }
      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, .4);
        transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }
      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font: 16px/1.2 'SF Pro', Arial, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ENTRANCE / SWITCH ANIMATIONS */
      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .planet-content .fact {
        opacity: 0;
      }
      .intro-ready .header {
        animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
      }
      .intro-ready .planet-list {
        animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
      }
      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
      }
      .content-revealing .fact {
        animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
      }
      .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
      .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
      .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
      .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

      .mask-revealing .portal-heading {
        animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item {
        animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
      .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
      .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
      .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
      .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
      .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
      .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
      .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
      .planet-list.is-switching .planet-item.active:before {
        animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
      }

      @keyframes reveal-down {
        from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes reveal-side {
        from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
        to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
      }
      @keyframes title-rise {
        from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
        to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
      }
      @keyframes fact-rise {
        from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes portal-caption {
        from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
        to { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes menu-row {
        from { opacity: .35; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes active-dot {
        from { opacity: 0; transform: scale(0); }
        to { opacity: 1; transform: scale(1); }
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .nav { display: none; }
        .portal-wrap { width: min(300px, 48vw); }
        .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
        .planet-content dl { width: 43vw; }
        .fact { grid-template-columns: 110px 1fr; }
        .planet-list { font-size: 14px; }
        .planet-item.active { font-size: 16px; }
      }
      @media (max-width: 640px) {
        .experience { min-height: 600px; }
        .planet-list { display: none; }
        .portal-wrap { top: 44%; width: min(260px, 66vw); }
        .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
        .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
        .planet-content dl { width: 100%; font-size: 13px; }
        .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
        .portal-heading { font-size: 14px; }
        .portal-heading strong { font-size: 16px; }
        .menu { height: 38px; }
        .portal { border-radius: 70px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: .01ms !important; }
        .portal { transform: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="experience" data-planet="mars">
      <div class="backgrounds" aria-hidden="true">
        <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
        <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>

      <aside class="planet-list chrome" aria-label="Planets"></aside>

      <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

      <section class="portal-wrap chrome" aria-label="Next destination">
        <div class="portal-heading">
          <span>Next:</span>

      <div class="transition-layer" aria-hidden="true">

    <script>
      (function() {
        const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
        const MARS_BG = BASE + '/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
        const TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
        const TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
        const TO_MARS = BASE + '/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4';
        const MERCURY = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
        const LOGO = BASE + '/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg';

        const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

        const states = {
          mars: {
            name: 'Mars',
            next: 'Earth',
            number: '[03]',
            portal: TO_EARTH,
            background: 'mars-background',
            facts: [
              ['Distance:', 'About 228 million km (1.5 astronomical units).'],
              ['Year:', 'One Martian year is equal to 687 Earth days.'],
              ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
              ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
            ]
          },
          earth: {
            name: 'Earth',
            next: 'Venus',
            number: '[02]',
            portal: TO_VENUS,
            background: 'earth-background',
            facts: [
              ['Distance:', '149.6 million km from the Sun.'],
              ['Year:', '365.25 Earth days.'],
              ['Temperature:', 'Average surface temperature around 15 °C.'],
              ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
            ]
          },
          venus: {
            name: 'Venus',
            next: 'Mercury',
            number: '[06]',
            image: MERCURY,
            background: 'venus-background',
            facts: [
              ['Distance:', '108.2 million km from the Sun.'],
              ['Year:', '225 Earth days.'],
              ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
              ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
            ]
          }
        };

        let current = 'mars';
        let busy = false;
        let isFirstRender = true;

        // Animation state variables
        let targetX = 0;
        let targetY = 0;
        let rotX = 0;
        let rotY = 0;
        let expansion = 0;
        let maskScale = 0;
        let canvasOpacity = 1;
        let transitionActive = false;
        let holdingFrozenFrame = false;

        // DOM elements
        const experience = document.querySelector('.experience');
        const planetTitle = document.getElementById('planet-title');
        const nextName = document.getElementById('next-name');
        const nextNumber = document.getElementById('next-number');
        const portal = document.getElementById('portal');
        const portalVideo = document.getElementById('portal-video');
        const portalImage = document.getElementById('portal-image');
        const factsContainer = document.getElementById('facts');
        const planetList = document.querySelector('.planet-list');
        const portalCanvas = document.getElementById('portal-canvas');
        const sceneCanvas = document.getElementById('scene-canvas');
        const transitionVideo = document.getElementById('transition-video');
        const customCursor = document.querySelector('.custom-cursor');
        const cursorDot = document.querySelector('.cursor-dot');

        const portalCtx = portalCanvas.getContext('2d');
        const sceneCtx = sceneCanvas.getContext('2d');

        // Easing: easeInOutCubic
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateValue(setter, duration) {
          return new Promise(function(resolve) {
            const startTime = performance.now();
            function tick(now) {
              const elapsed = now - startTime;
              const progress = Math.min(1, elapsed / duration);
              setter(easeInOutCubic(progress));
              if (progress < 1) {
                requestAnimationFrame(tick);
              } else {
                setter(1);
                resolve();
              }
            }
            requestAnimationFrame(tick);
          });
        }

        function resizeCanvas() {
          const d = Math.min(window.devicePixelRatio || 1, 2);
          portalCanvas.width = window.innerWidth * d;
          portalCanvas.height = window.innerHeight * d;
          portalCanvas.style.width = window.innerWidth + 'px';
          portalCanvas.style.height = window.innerHeight + 'px';
          portalCtx.setTransform(d, 0, 0, d, 0, 0);

          if (!holdingFrozenFrame) {
            sceneCanvas.width = window.innerWidth * d;
            sceneCanvas.height = window.innerHeight * d;
            sceneCanvas.style.width = window.innerWidth + 'px';
            sceneCanvas.style.height = window.innerHeight + 'px';
            sceneCtx.setTransform(d, 0, 0, d, 0, 0);
          }
        }

        window.addEventListener('resize', resizeCanvas);

        function drawCover(ctx, media) {
          const mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
          const mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
          if (!mw || !mh) return;
          const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
          const w = mw * scale;
          const h = mh * scale;
          ctx.drawImage(media, (window.innerWidth - w) / 2, (window.innerHeight - h) / 2, w, h);
        }

        function drawShade(ctx) {
          const y0 = window.innerHeight * 0.52;
          const y1 = window.innerHeight;
          const grad = ctx.createLinearGradient(0, y0, 0, y1);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, 'rgba(0,0,0,0.88)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, y0, window.innerWidth, window.innerHeight - y0);
        }

        // Pointer tilt tracking
        window.addEventListener('pointermove', function(e) {
          if (busy) return;
          targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
          targetX = (e.clientY / window.innerHeight - 0.5) * -33;
        });

        document.addEventListener('pointerleave', function() {
          if (busy) return;
          targetX = 0;
          targetY = 0;
        });

        // Frame loop
        let lastTime = performance.now();
        function draw(now) {
          const dt = Math.min(now - lastTime, 40);
          lastTime = now;

          if (!busy) {
            rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
            rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
          }

          portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          if (holdingFrozenFrame) {
            portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
            drawShade(portalCtx);
          }

          if (portal) {
            const rect = portal.getBoundingClientRect();
            const e = expansion;
            const rectCx = rect.left + rect.width / 2;
            const rectCy = rect.top + rect.height / 2;

            const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
            const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;

            const baseW = rect.width + (window.innerWidth - rect.width) * e;
            const baseH = rect.height + (window.innerHeight - rect.height) * e;

            const scale = e ? 1 : maskScale;
            const w = baseW * scale;
            const h = baseH * scale;

            let r = 90 * (1 - e) * scale;
            r = Math.max(0, Math.min(r, w / 2, h / 2));

            const rx = rotX * (1 - e);
            const ry = rotY * (1 - e);

            if (w > 1 && h > 1) {
              const points = [];
              const arcs = [
                { cx: w / 2 - r,  cy: -h / 2 + r, a0: -Math.PI / 2, a1: 0 },
                { cx: w / 2 - r,  cy: h / 2 - r,  a0: 0,            a1: Math.PI / 2 },
                { cx: -w / 2 + r, cy: h / 2 - r,  a0: Math.PI / 2,  a1: Math.PI },
                { cx: -w / 2 + r, cy: -h / 2 + r, a0: Math.PI,      a1: Math.PI * 1.5 }
              ];

              for (let a = 0; a < 4; a++) {
                const arc = arcs[a];
                for (let i = 0; i <= 10; i++) {
                  const angle = arc.a0 + (arc.a1 - arc.a0) * (i / 10);
                  points.push({
                    x: arc.cx + r * Math.cos(angle),
                    y: arc.cy + r * Math.sin(angle)
                  });
                }
              }

              const ax = rx * Math.PI / 180;
              const ay = ry * Math.PI / 180;
              const cosAy = Math.cos(ay);
              const sinAy = Math.sin(ay);
              const cosAx = Math.cos(ax);
              const sinAx = Math.sin(ax);

              const projected = points.map(function(pt) {
                const xx = pt.x * cosAy;
                const yy = pt.y * cosAx;
                const z = pt.x * sinAy - pt.y * sinAx;
                const p = 850 / (850 + z);
                return [cx + xx * p, cy + yy * p];
              });

              portalCtx.save();
              portalCtx.globalAlpha = canvasOpacity;

              portalCtx.beginPath();
              portalCtx.moveTo(projected[0][0], projected[0][1]);
              for (let i = 1; i < projected.length; i++) {
                portalCtx.lineTo(projected[i][0], projected[i][1]);
              }
              portalCtx.closePath();
              portalCtx.clip();

              portalCtx.fillStyle = '#030303';
              portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

              const st = states[current];
              const activeMedia = transitionActive ? transitionVideo : (st.image ? portalImage : portalVideo);
              if (activeMedia) {
                drawCover(portalCtx, activeMedia);
              }

              if (transitionActive) {
                drawShade(portalCtx);
              }

              portalCtx.restore();
            }
          }

          requestAnimationFrame(draw);
        }

        // Custom Cursor
        let pointerX = window.innerWidth / 2;
        let pointerY = window.innerHeight / 2;
        let orbitX = pointerX;
        let orbitY = pointerY;
        let cursorMoved = false;

        window.addEventListener('pointermove', function(e) {
          pointerX = e.clientX;
          pointerY = e.clientY;
          if (!cursorMoved) {
            cursorMoved = true;
            orbitX = pointerX;
            orbitY = pointerY;
            customCursor.classList.add('is-visible');
          }
        });

        document.addEventListener('mouseleave', function() {
          customCursor.classList.remove('is-visible');
        });

        portal.addEventListener('pointerenter', function() {
          customCursor.classList.add('is-enter');
        });
        portal.addEventListener('pointerleave', function() {
          customCursor.classList.remove('is-enter');
        });

        function cursorLoop() {
          orbitX += (pointerX - orbitX) * 0.2;
          orbitY += (pointerY - orbitY) * 0.2;

          customCursor.style.transform = 'translate3d(' + orbitX + 'px, ' + orbitY + 'px, 0)';
          if (cursorDot) {
            cursorDot.style.transform = 'translate3d(' + (pointerX - orbitX) + 'px, ' + (pointerY - orbitY) + 'px, 0) translate(-50%, -50%)';
          }

          requestAnimationFrame(cursorLoop);
        }

        // Render data model
        function render() {
          const st = states[current];
          experience.setAttribute('data-planet', current);
          planetTitle.textContent = st.name.toUpperCase();
          nextName.textContent = st.next;
          nextNumber.textContent = st.number;
          portal.setAttribute('aria-label', 'Travel to ' + st.next);

          factsContainer.innerHTML = st.facts
            .map(function(item) {
              return '<div class="fact"><dt>' + item[0] + '</dt><dd>' + item[1] + '</dd></div>';
            })
            .join('');

          planetList.innerHTML = planets
            .map(function(p) {
              const isActive = p.toLowerCase() === current;
              return '<span class="planet-item' + (isActive ? ' active' : '') + '">' + p + '</span>';
            })
            .join('');

          if (!isFirstRender) {
            planetList.classList.remove('is-switching');
            void planetList.offsetWidth;
            planetList.classList.add('is-switching');
          } else {
            isFirstRender = false;
          }

          document.querySelectorAll('.background').forEach(function(v) {
            if (v.id === st.background) {
              v.classList.add('is-visible');
              try {
                v.loop = true;
                v.play().catch(function() {});
              } catch (err) {}
            } else {
              v.classList.remove('is-visible');
              try {
                v.pause();
              } catch (err) {}
            }
          });

          if (st.image) {
            portalImage.style.display = 'block';
            portalVideo.style.display = 'none';
            try {
              portalVideo.pause();
            } catch (err) {}
          } else {
            portalImage.style.display = 'none';
            portalVideo.style.display = 'block';
            if (portalVideo.getAttribute('src') !== st.portal) {
              portalVideo.src = st.portal;
              portalVideo.load();
            }
            try {
              portalVideo.loop = true;
              portalVideo.play().catch(function() {});
            } catch (err) {}
          }
        }

        function revealMask() {
          experience.classList.remove('mask-revealing');
          void experience.offsetWidth;
          experience.classList.add('mask-revealing');
          maskScale = 0;
          return animateValue(function(v) { maskScale = v; }, 1050);
        }

        function revealPlanetContent() {
          experience.classList.remove('content-revealing');
          void experience.offsetWidth;
          experience.classList.add('content-revealing');
        }

        function waitForMedia(media) {
          return new Promise(function(resolve) {
            if (!media) return resolve();
            if (media.tagName === 'IMG') {
              if (media.complete && media.naturalWidth > 0) return resolve();
              media.addEventListener('load', function() { resolve(); }, { once: true });
              media.addEventListener('error', function() { resolve(); }, { once: true });
            } else {
              if (media.readyState >= 2) return resolve();
              media.addEventListener('canplay', function() { resolve(); }, { once: true });
              media.addEventListener('error', function() { resolve(); }, { once: true });
            }
            setTimeout(resolve, 2000);
          });
        }

        async function startExperience() {
          const st = states[current];
          const currentMedia = st.image ? portalImage : portalVideo;
          if (!st.image && portalVideo) {
            try {
              portalVideo.loop = true;
              portalVideo.play().catch(function() {});
            } catch (err) {}
          }
          const bgVideo = document.getElementById(st.background);
          if (bgVideo) {
            try {
              bgVideo.loop = true;
              bgVideo.play().catch(function() {});
            } catch (err) {}
          }

          await waitForMedia(currentMedia);
          await revealMask();
          document.body.classList.add('intro-ready');
          setTimeout(function() {
            revealPlanetContent();
          }, 850);
        }

        async function travel() {
          if (busy || current === 'venus') return;
          busy = true;
          targetX = 0;
          targetY = 0;
          const next = current === 'mars' ? 'earth' : 'venus';

          try {
            transitionVideo.src = states[current].portal;
            transitionVideo.load();
            experience.classList.add('is-loading');

            await new Promise(function(resolve) {
              let done = false;
              function finish() {
                if (!done) {
                  done = true;
                  transitionVideo.removeEventListener('canplaythrough', finish);
                  transitionVideo.removeEventListener('error', finish);
                  clearTimeout(timer);
                  resolve();
                }
              }
              const timer = setTimeout(finish, 1600);
              transitionVideo.addEventListener('canplaythrough', finish, { once: true });
              transitionVideo.addEventListener('error', finish, { once: true });
            });

            experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
            experience.classList.add('is-transitioning');

            transitionVideo.currentTime = 0;
            transitionVideo.playbackRate = 1.3;
            canvasOpacity = 1;
            transitionActive = true;
            try {
              await transitionVideo.play();
            } catch (err) {
              console.warn('Transition play caught:', err);
            }

            await animateValue(function(v) { expansion = v; }, 1100);

            await new Promise(function(resolve) {
              let resolved = false;
              function onEnded() {
                if (!resolved) {
                  resolved = true;
                  transitionVideo.removeEventListener('ended', onEnded);
                  resolve();
                }
              }
              transitionVideo.addEventListener('ended', onEnded, { once: true });
              const dur = (transitionVideo.duration && isFinite(transitionVideo.duration))
                ? (transitionVideo.duration / 1.3 * 1000 + 1000)
                : 5000;
              setTimeout(onEnded, dur);
            });

            const d = Math.min(window.devicePixelRatio || 1, 2);
            sceneCanvas.width = window.innerWidth * d;
            sceneCanvas.height = window.innerHeight * d;
            sceneCtx.setTransform(d, 0, 0, d, 0, 0);
            sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            drawCover(sceneCtx, transitionVideo);
            holdingFrozenFrame = true;

            current = next;
            experience.classList.add('is-committing');
            render();

            await new Promise(function(r) {
              requestAnimationFrame(function() {
                requestAnimationFrame(r);
              });
            });

            transitionActive = false;
            expansion = 0;
            maskScale = 0;
            canvasOpacity = 1;

            experience.classList.remove('is-transitioning', 'is-committing');

            const maskRevealPromise = revealMask();
            setTimeout(function() {
              revealPlanetContent();
            }, 100);
            await maskRevealPromise;

            setTimeout(function() {
              transitionVideo.removeAttribute('src');
              transitionVideo.load();
              holdingFrozenFrame = false;
              busy = false;
            }, 450);
          } catch (err) {
            console.error('Travel exception:', err);
            transitionActive = false;
            expansion = 0;
            maskScale = 1;
            canvasOpacity = 1;
            experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
            holdingFrozenFrame = false;
            busy = false;
          }
        }

        portal.addEventListener('click', travel);

        // Preloader
        function runPreloader() {
          const preloaderVideo = document.getElementById('preloader-video');
          const countEl = document.getElementById('preloader-count');
          const valueEl = document.getElementById('preloader-value');
          const logoEl = document.getElementById('floating-logo');
          const preloaderEl = document.getElementById('preloader');

          let finished = false;
          function finish() {
            if (finished) return;
            finished = true;
            if (valueEl) valueEl.textContent = '100';
            if (countEl) countEl.classList.add('is-leaving');
            if (logoEl) logoEl.classList.add('is-docked');
            if (preloaderEl) preloaderEl.classList.add('is-background');
            document.body.classList.add('preload-complete');

            startExperience();

            setTimeout(function() {
              if (countEl && countEl.parentNode) {
                countEl.remove();
              }
            }, 750);

            setTimeout(function() {
              if (logoEl) logoEl.classList.add('is-settled');
            }, 2000);
          }

          function updateProgress() {
            if (finished) return;
            if (preloaderVideo.duration && preloaderVideo.duration > 0) {
              const pct = Math.min(99, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
              if (valueEl) valueEl.textContent = String(pct);
            }
            requestAnimationFrame(updateProgress);
          }

          function startPlayback() {
            try {
              preloaderVideo.playbackRate = Math.max(0.25, (preloaderVideo.duration || 3) / 3);
              const p = preloaderVideo.play();
              if (p && p.catch) {
                p.catch(function() { finish(); });
              }
              requestAnimationFrame(updateProgress);
            } catch (err) {
              finish();
            }
          }

          preloaderVideo.addEventListener('ended', finish, { once: true });
          preloaderVideo.addEventListener('error', finish, { once: true });

          if (preloaderVideo.readyState >= 1) {
            startPlayback();
          } else {
            preloaderVideo.addEventListener('loadedmetadata', startPlayback, { once: true });
          }

          // Safety fallback
          setTimeout(function() {
            if (!finished) finish();
          }, 6000);
        }

        // Prevent dead anchor navigation
        document.querySelectorAll('.nav a').forEach(function(a) {
          a.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.nav a').forEach(function(el) { el.classList.remove('active'); });
            a.classList.add('active');
          });
        });

        // 12. BOOT ORDER
        document.querySelectorAll('.background').forEach(function(v) {
          v.pause();
          v.currentTime = 0;
        });
        resizeCanvas();
        render();
        requestAnimationFrame(draw);
        requestAnimationFrame(cursorLoop);
        runPreloader();
      })();
    </script>
  </body>
</html>
